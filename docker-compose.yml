version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: psp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - psp-network

  postgres:
    image: postgres:16
    container_name: psp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: psp
      POSTGRES_PASSWORD: psp
      POSTGRES_DB: psp_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psp -d psp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psp-network

  # ── Application Services ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psp-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://psp:psp@postgres:5432/psp_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app          # live reload for development
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - psp-network

  agents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psp-agents
    command: python -m app.AgentRunner
    environment:
      - DATABASE_URL=postgresql+asyncpg://psp:psp@postgres:5432/psp_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app          # live reload for development
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - psp-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: psp-celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://psp:psp@postgres:5432/psp_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - psp-network

volumes:
  postgres-data:

networks:
  psp-network:
    driver: bridge